[project]
site_name = "ae2"
version = "0.1.0"
description = "Web estatica y manual de nginx con zensical"
readme = "README.md"
authors = [
    { name = "Raúl Luis Domínguez", email = "raluido@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []
docs_dir = "docs"
site_dir = "site"

[nav]
"Inicio" = "index.md"

[project.scripts]
ae2 = "ae2:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "zensical>=0.0.68",
]
